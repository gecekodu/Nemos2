<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2048 Hex</title>
  <style>
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #faf8ef;
      color: #776e65;
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .header { width: 340px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;}
    .title { font-size: 48px; font-weight: bold; margin: 0; }
    .score-container { background: #bbada0; padding: 8px 16px; border-radius: 6px; color: white; text-align: center; }
    .score-title { font-size: 13px; text-transform: uppercase; }
    .score { font-size: 20px; font-weight: bold; }
    .board {
      width: 340px; height: 340px;
      background: #bbada0; border-radius: 10px;
      padding: 10px; box-sizing: border-box;
      position: relative;
    }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; height: 100%; }
    .cell { background: #cdc1b4; border-radius: 6px; }
    .tile {
      position: absolute; width: 72.5px; height: 72.5px;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: bold;
      transition: all 0.1s ease-in-out;
    }
    .game-over {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(238, 228, 218, 0.73); border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .game-over.active { opacity: 1; pointer-events: auto; }
    .game-over h2 { font-size: 40px; margin-bottom: 20px; color: #776e65; }
    .btn { background: #8f7a66; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; }
    .btn:active { background: #7f6a56; }
    
    /* Colors */
    .t-2 { background: #eee4da; color: #776e65; }
    .t-4 { background: #ede0c8; color: #776e65; }
    .t-8 { background: #f2b179; color: #f9f6f2; }
    .t-16 { background: #f59563; color: #f9f6f2; }
    .t-32 { background: #f67c5f; color: #f9f6f2; }
    .t-64 { background: #f65e3b; color: #f9f6f2; }
    .t-128 { background: #edcf72; color: #f9f6f2; font-size: 28px; }
    .t-256 { background: #edcc61; color: #f9f6f2; font-size: 28px; }
    .t-512 { background: #edc850; color: #f9f6f2; font-size: 28px; }
    .t-1024 { background: #edc53f; color: #f9f6f2; font-size: 22px; }
    .t-2048 { background: #edc22e; color: #f9f6f2; font-size: 22px; }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">2048</h1>
    <div class="score-container">
      <div class="score-title">Score</div>
      <div class="score" id="score">0</div>
    </div>
  </div>
  <div class="board" id="board">
    <div class="grid" id="grid">
      <!-- 16 cells background -->
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>
    <div id="tiles"></div>
    <div class="game-over" id="gameOverMenu">
      <h2>Oyun Bitti!</h2>
      <button class="btn" onclick="init()">Tekrar Oyna</button>
    </div>
  </div>

  <script>
    let gridObject = [];
    let score = 0;
    const boardSize = 4;
    const tilesContainer = document.getElementById('tiles');
    const scoreEl = document.getElementById('score');
    const gameOverMenu = document.getElementById('gameOverMenu');

    function init() {
      gridObject = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
      score = 0;
      updateScore();
      tilesContainer.innerHTML = '';
      gameOverMenu.classList.remove('active');
      addRandomTile();
      addRandomTile();
      render();
    }

    function addRandomTile() {
      let emptyCells = [];
      for (let r = 0; r < boardSize; r++) {
        for (let c = 0; c < boardSize; c++) {
          if (gridObject[r][c] === 0) emptyCells.push({r, c});
        }
      }
      if (emptyCells.length === 0) return;
      let rand = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      gridObject[rand.r][rand.c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      tilesContainer.innerHTML = '';
      for (let r = 0; r < boardSize; r++) {
        for (let c = 0; c < boardSize; c++) {
          if (gridObject[r][c] !== 0) {
            let val = gridObject[r][c];
            let tile = document.createElement('div');
            tile.className = `tile t-${val > 2048 ? '2048' : val}`;
            tile.textContent = val;
            // Calculate absolute position mapping
            // Padding 10px, cell gap 10px, cell size 72.5px
            let left = 10 + c * (72.5 + 10);
            let top = 10 + r * (72.5 + 10);
            tile.style.transform = `translate(${left}px, ${top}px)`;
            tilesContainer.appendChild(tile);
          }
        }
      }
    }

    function updateScore() {
      scoreEl.textContent = score;
    }

    function move(direction) {
      if(gameOverMenu.classList.contains('active')) return;
      
      let moved = false;
      let newGrid = Array(boardSize).fill().map(() => Array(boardSize).fill(0));

      function processRow(row) {
        let arr = row.filter(val => val !== 0);
        for (let i = 0; i < arr.length - 1; i++) {
          if (arr[i] === arr[i+1]) {
            arr[i] *= 2;
            score += arr[i];
            arr.splice(i+1, 1);
            moved = true;
          }
        }
        while (arr.length < boardSize) arr.push(0);
        // Check if anything actually changed position
        for(let i=0; i<boardSize; i++) {
          if(row[i] !== arr[i]) moved = true;
        }
        return arr;
      }

      if (direction === 'LEFT' || direction === 'RIGHT') {
        for (let r = 0; r < boardSize; r++) {
          let row = gridObject[r].slice();
          if (direction === 'RIGHT') row.reverse();
          row = processRow(row);
          if (direction === 'RIGHT') row.reverse();
          newGrid[r] = row;
        }
      } else if (direction === 'UP' || direction === 'DOWN') {
        for (let c = 0; c < boardSize; c++) {
          let col = [gridObject[0][c], gridObject[1][c], gridObject[2][c], gridObject[3][c]];
          if (direction === 'DOWN') col.reverse();
          col = processRow(col);
          if (direction === 'DOWN') col.reverse();
          for (let r = 0; r < boardSize; r++) newGrid[r][c] = col[r];
        }
      }

      if (moved) {
        gridObject = newGrid;
        updateScore();
        addRandomTile();
        render();
        checkGameOver();
      }
    }

    function checkGameOver() {
      // Check empty
      for(let r=0; r<boardSize; r++) {
        for(let c=0; c<boardSize; c++) {
          if(gridObject[r][c] === 0) return;
        }
      }
      // Check merges
      for(let r=0; r<boardSize; r++) {
        for(let c=0; c<boardSize; c++) {
          let val = gridObject[r][c];
          if(r < boardSize-1 && gridObject[r+1][c] === val) return;
          if(c < boardSize-1 && gridObject[r][c+1] === val) return;
        }
      }
      gameOverMenu.classList.add('active');
    }

    // Input handling
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') move('UP');
      if (e.key === 'ArrowDown' || e.key === 's') move('DOWN');
      if (e.key === 'ArrowLeft' || e.key === 'a') move('LEFT');
      if (e.key === 'ArrowRight' || e.key === 'd') move('RIGHT');
    });

    let touchStartX = 0;
    let touchStartY = 0;
    document.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      e.preventDefault(); // Prevents scroll
    }, {passive: false});

    document.addEventListener('touchend', e => {
      let touchEndX = e.changedTouches[0].clientX;
      let touchEndY = e.changedTouches[0].clientY;
      let dx = touchEndX - touchStartX;
      let dy = touchEndY - touchStartY;
      
      if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > 30) dx > 0 ? move('RIGHT') : move('LEFT');
      } else {
        if (Math.abs(dy) > 30) dy > 0 ? move('DOWN') : move('UP');
      }
    });

    // Auto start immediately as requested
    init();

  </script>
</body>
</html>
