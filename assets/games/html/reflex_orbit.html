<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reflex Orbit</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", Tahoma, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 40% 15%, #0b728b, #091728 67%);
    }
    canvas {
      width: min(95vw, 540px);
      height: min(95vh, 960px);
      aspect-ratio: 9 / 16;
      border: 1px solid #77daff;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      touch-action: none;
      background: #0f1f34;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="game" width="540" height="960" aria-label="Reflex Orbit oyunu"></canvas>
  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      const totalTime = 50;

      const state = {
        mode: "playing",
        score: 0,
        misses: 0,
        elapsed: 0,
        angle: 0,
        speed: 2.6,
        targetStart: 0,
        targetSize: Math.PI / 4,
      };

      function resetGame() {
        state.mode = "playing";
        state.score = 0;
        state.misses = 0;
        state.elapsed = 0;
        state.angle = 0;
        state.speed = 2.6;
        rerollTarget();
      }

      function rerollTarget() {
        state.targetStart = Math.random() * Math.PI * 2;
      }

      function inTarget(angle) {
        const norm = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        const start = state.targetStart;
        const end = start + state.targetSize;
        if (end <= Math.PI * 2) {
          return norm >= start && norm <= end;
        }
        return norm >= start || norm <= end - Math.PI * 2;
      }

      function triggerHit() {
        if (state.mode !== "playing") return;
        if (inTarget(state.angle)) {
          state.score += 12;
          state.speed += 0.08;
        } else {
          state.misses += 1;
        }
        rerollTarget();
      }

      function update(dt) {
        if (state.mode !== "playing") return;
        state.elapsed += dt;
        state.angle += dt * state.speed;

        if (state.misses >= 5) {
          state.mode = "over";
        }

        if (state.elapsed >= totalTime) {
          state.mode = "over";
        }
      }

      function drawOrbit() {
        const cx = width / 2;
        const cy = height / 2 + 30;
        const radius = 180;

        ctx.lineWidth = 20;
        ctx.strokeStyle = "#214768";
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = "#22d3ee";
        ctx.beginPath();
        ctx.arc(cx, cy, radius, state.targetStart, state.targetStart + state.targetSize);
        ctx.stroke();

        const px = cx + Math.cos(state.angle) * radius;
        const py = cy + Math.sin(state.angle) * radius;
        ctx.fillStyle = "#f8fafc";
        ctx.beginPath();
        ctx.arc(px, py, 18, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawHud() {
        ctx.fillStyle = "rgba(7, 15, 25, 0.55)";
        ctx.fillRect(18, 20, width - 36, 86);

        ctx.fillStyle = "#ecf6ff";
        ctx.font = "600 28px Segoe UI";
        ctx.fillText(`Skor: ${state.score}`, 32, 62);
        ctx.fillText(`Hata: ${state.misses}/5`, 210, 62);
        ctx.fillText(`Süre: ${Math.max(0, Math.ceil(totalTime - state.elapsed))}`, 360, 62);
      }

      function drawMenu() {
        ctx.fillStyle = "#0f1f34";
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "#e3f6ff";
        ctx.font = "700 54px Segoe UI";
        ctx.fillText("Reflex Orbit", 102, 260);
        ctx.font = "500 28px Segoe UI";
        ctx.fillText("Nokta hedef yaydayken dokun", 102, 340);
        ctx.fillText("5 hata hakkın var", 166, 380);
        // ctx.fillText( 105, 420);
      }

      function drawGame() {
        ctx.fillStyle = "#0f1f34";
        ctx.fillRect(0, 0, width, height);
        drawHud();
        drawOrbit();

        ctx.fillStyle = "#bdefff";
        ctx.font = "500 24px Segoe UI";
        ctx.fillText("Vur: dokun / Space", 176, 860);
      }

      function drawOver() {
        drawGame();

        ctx.fillStyle = "rgba(4, 10, 18, 0.8)";
        ctx.fillRect(58, 340, width - 116, 274);

        ctx.fillStyle = "#e9f7ff";
        ctx.font = "700 46px Segoe UI";
        ctx.fillText("Seans Sonu", 148, 418);
        ctx.font = "600 30px Segoe UI";
        ctx.fillText(`Skor: ${state.score}`, 192, 470);
        ctx.fillText(`Hata: ${state.misses}`, 194, 514);
        ctx.font = "500 24px Segoe UI";
        ctx.fillText("Yeniden: Enter veya dokun", 120, 560);
      }

      function draw() {
        if (state.mode === "menu") drawMenu();
        else if (state.mode === "playing") drawGame();
        else drawOver();
      }

      canvas.addEventListener("pointerdown", () => {
        if (state.mode === "menu" || state.mode === "over") {
          resetGame();
          draw();
          return;
        }
        triggerHit();
      });

      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();

        if (key === "f") {
          if (!document.fullscreenElement) document.documentElement.requestFullscreen();
          else document.exitFullscreen();
          return;
        }

        if (key === "escape" && document.fullscreenElement) {
          document.exitFullscreen();
          return;
        }

        if (key === " " || key === "enter") {
          if (state.mode === "menu" || state.mode === "over") {
            resetGame();
          } else {
            triggerHit();
          }
        }
      });

      let prev = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - prev) / 1000);
        prev = now;
        update(dt);
        draw();
        
      if (!window.autoStartedNemos) {
        window.autoStartedNemos = true;
        if (typeof resetGame === 'function') resetGame();
        if (typeof init === 'function') { init(); if (typeof gameState !== 'undefined') gameState = 'PLAYING'; }
      }

      requestAnimationFrame(frame);
      }

      function renderGameToText() {
        return JSON.stringify({
          coordinate_system: "origin_top_left_x_right_y_down_canvas_540x960",
          mode: state.mode,
          score: state.score,
          misses: state.misses,
          remaining_seconds: Math.max(0, Math.ceil(totalTime - state.elapsed)),
          angle: Number(state.angle.toFixed(3)),
          target_start: Number(state.targetStart.toFixed(3)),
          target_size: Number(state.targetSize.toFixed(3)),
        });
      }

      window.render_game_to_text = renderGameToText;
      window.advanceTime = (ms) => {
        const steps = Math.max(1, Math.round(ms / (1000 / 60)));
        const dt = 1 / 60;
        for (let i = 0; i < steps; i += 1) update(dt);
        draw();
      };

      draw();
      
      if (!window.autoStartedNemos) {
        window.autoStartedNemos = true;
        if (typeof resetGame === 'function') resetGame();
        if (typeof init === 'function') { init(); if (typeof gameState !== 'undefined') gameState = 'PLAYING'; }
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
